name: Merge index

# On demand. A source repository publishing a new version does not reach anyone
# until this runs: ReaPack clients import the merged index from THIS repository,
# so the per-repo indexes are only inputs.
#
# There is no push trigger here on purpose -- nothing in this repository changes
# when a source repository cuts a version, so there would be nothing to fire on.
# The scheduled run is the safety net for forgetting to press the button.
on:
  workflow_dispatch:
  # Let a source repository trigger it directly:
  #   curl -X POST -H "Accept: application/vnd.github+json" \
  #     -H "Authorization: Bearer $TOKEN" \
  #     https://api.github.com/repos/michal-bartak/ReaPack/dispatches \
  #     -d '{"event_type":"reapack-index-updated"}'
  # The token needs contents:write on THIS repository, so it has to be a PAT
  # held as a secret in the source repository -- GITHUB_TOKEN cannot reach here.
  repository_dispatch:
    types: [reapack-index-updated]
  schedule:
    - cron: '17 6 * * 1'        # Mondays, 06:17 UTC

permissions:
  contents: write               # the job pushes the regenerated index

concurrency:
  group: merge-index            # never let two runs race on the same file
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # merge-index.py is pure standard library, so nothing is installed.
      - name: Regenerate the merged index
        run: ./merge-index.py

      # The script is idempotent and prints "index.xml unchanged" when the
      # sources have not moved, so an unnecessary run is a no-op, not a commit.
      - name: Commit and push if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- index.xml; then
            echo "index.xml is already up to date -- nothing to push"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.xml
          git commit -m 'index: merge the source repositories' \
                     -m 'Regenerated by the Merge index workflow.'
          git push

      # Fails the run if the file on disk still disagrees with the sources --
      # which would mean the merge is not reproducible, not that it is stale.
      - name: Verify
        run: ./merge-index.py --check
